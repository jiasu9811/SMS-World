<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMS-World 管理入口</title><link rel="stylesheet" href="/style.css"></head><body><main><section class="panel"><p class="eyebrow">ADMIN</p><h1>号码来源管理</h1><p class="muted">输入部署时设置的 ADMIN_TOKEN。令牌只保存在当前页面内存中，不会写入仓库。</p><div class="filters"><input id="token" type="password" placeholder="ADMIN_TOKEN"><button id="load">读取来源</button></div><div id="result" class="empty">登录后查看号码来源状态。</div><p><a href="/">返回网站首页</a></p></section></main><script>
const el=document.querySelector("#result");document.querySelector("#load").onclick=async()=>{el.textContent="正在读取…";try{const r=await fetch("/api/admin/sources",{headers:{authorization:"Bearer "+document.querySelector("#token").value}});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);el.innerHTML=(d.sources||[]).map(s=>'<article class="number-card"><b>'+String(s.name).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</b><p class="meta">类型：'+s.kind+' · 已授权：'+(s.authorization_confirmed?'是':'否')+' · 允许公开：'+(s.public_display_allowed?'是':'否')+' · 启用：'+(s.enabled?'是':'否')+'</p><p class="meta">最近同步：'+(s.last_sync_at||'尚未同步')+' · 错误：'+(s.last_error||'无')+'</p></article>').join('')||'尚无来源配置';}catch(e){el.textContent="读取失败："+e.message}};</script></body></html>
